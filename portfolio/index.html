<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Projects in Python, object-oriented programming and data science.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <!--
    ============================================================
    EDIT ONLY THE JSON BELOW. Everything on the page comes from it.
    Save, refresh the browser, and you're done.
    ============================================================
  -->
  <script type="application/json" id="profile">
  {
    "name": "Your Name",
    "role": "Python developer and data science student",
    "location": "Lagos, Nigeria",
    "accent": "#5b3df5",
    "intro": "I build things with Python: object-oriented apps, data analysis with pandas and NumPy, and web apps people can actually use.",
    "about": "Write 2–3 sentences about yourself here: what you study, what you enjoy building, and what kind of role or internship you're looking for.",
    "links": {
      "github": "https://github.com/your-username",
      "linkedin": "",
      "email": "you@example.com",
      "cv": ""
    },
    "featured": {
      "title": "Flyte: airline booking and analytics web app",
      "summary": "A full flight-booking web app grown from an OOP coursework project. Travellers compare four airlines, book one-way, return or multi-city trips, pick seats, add luggage and check in. Staff get a live analytics dashboard with demand forecasting and customer segmentation.",
      "image": "assets/flyte-home.jpg",
      "gallery": ["assets/flyte-search.jpg", "assets/flyte-dashboard.jpg"],
      "role": "Built together with a collaborator.",
      "contributions": [
        "Write what YOU did here, one line each.",
        "For example: designed the OOP class structure (Flight, Booking, AirlineSystem).",
        "For example: built the pricing engine and the return-trip discount."
      ],
      "tech": ["Python", "OOP", "Flask", "pandas", "NumPy", "SQLite", "JavaScript", "unittest"],
      "highlights": [
        ["109", "Python classes"],
        ["33", "automated tests"],
        ["7.7%", "forecast error"]
      ],
      "code": "https://github.com/your-username/flyte",
      "demo": ""
    },
    "skills": [
      ["Languages", ["Python", "JavaScript", "HTML", "CSS", "SQL"]],
      ["Data", ["pandas", "NumPy", "Data cleaning", "Forecasting", "K-means clustering"]],
      ["Engineering", ["Object-oriented design", "Flask", "Unit testing", "Git and GitHub"]]
    ],
    "projects": [
      {
        "title": "Another project",
        "summary": "One or two sentences on what it does and what you learned.",
        "tech": ["Python"],
        "link": ""
      }
    ]
  }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbfbfd; --paper: #ffffff; --ink: #16133a; --ink-2: #4c4874; --ink-3: #6f6b98; --line: #e3e3ef;
      --accent: #5b3df5; --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
      --body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0f0e1f; --paper: #17152e; --ink: #f2f0ff; --ink-2: #c3bff0; --ink-3: #9893c9; --line: #2c2958; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0f0e1f; --paper: #17152e; --ink: #f2f0ff; --ink-2: #c3bff0; --ink-3: #9893c9; --line: #2c2958; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--body); }
    a { color: inherit; text-underline-offset: 3px; }
    img { max-width: 100%; display: block; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
    h1, h2, h3 { font-family: var(--display); letter-spacing: -.03em; line-height: 1.05; margin: 0; }
    h2 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 20px; }
    p { margin: 0; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    header.top { padding: 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 800 16px var(--display); }
    .theme { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 14px var(--body); cursor: pointer; }

    .hero { padding: clamp(40px, 8vw, 96px) 0 clamp(40px, 6vw, 72px); }
    .hero h1 { font-size: clamp(52px, 10vw, 112px); letter-spacing: -.05em; }
    .hero .role { font: 600 clamp(18px, 2.2vw, 22px) var(--display); color: var(--accent); margin-top: 14px; }
    .hero .intro { font-size: clamp(18px, 2vw, 21px); color: var(--ink-2); max-width: 46ch; margin-top: 18px; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); text-decoration: none; font-weight: 600; font-size: 15px; transition: border-color .15s, transform .15s; }
    .btn:hover { border-color: var(--ink-3); transform: translateY(-1px); }
    .btn--accent { background: var(--accent); border-color: var(--accent); color: #fff; }

    section { padding: clamp(36px, 6vw, 64px) 0; border-top: 1px solid var(--line); }
    .about p { font-size: 19px; color: var(--ink-2); max-width: 62ch; }

    .feature { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(20px, 4vw, 44px); align-items: start; }
    .shot { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 60px -30px rgba(30, 20, 90, .45); background: var(--paper); }
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .gallery .shot { border-radius: 12px; box-shadow: none; }
    .feature h3 { font-size: clamp(24px, 3vw, 32px); }
    .feature .summary { color: var(--ink-2); margin-top: 12px; }
    .stats { display: flex; gap: 22px; margin: 22px 0; flex-wrap: wrap; }
    .stats strong { display: block; font: 800 30px/1 var(--display); letter-spacing: -.03em; color: var(--accent); }
    .stats span { font-size: 13px; color: var(--ink-3); }
    .label { font-weight: 700; font-size: 14px; margin: 20px 0 8px; }
    ul.did { margin: 0; padding-left: 20px; color: var(--ink-2); }
    ul.did li + li { margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 5px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 600; }
    .feature .links { margin-top: 22px; }

    .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .skillset h3 { font-size: 18px; margin-bottom: 10px; }
    .projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card { padding: 22px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); display: grid; gap: 10px; align-content: start; }
    .card h3 { font-size: 20px; }
    .card p { color: var(--ink-2); font-size: 15.5px; }
    footer { padding: 36px 0 56px; color: var(--ink-3); font-size: 14px; border-top: 1px solid var(--line); }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .feature, .projects { grid-template-columns: 1fr; }
      .skills { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero > * { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
      .hero > :nth-child(2) { animation-delay: .08s; } .hero > :nth-child(3) { animation-delay: .16s; } .hero > :nth-child(4) { animation-delay: .24s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="mark" id="mark" aria-hidden="true">YN</span>
      <button class="theme" type="button" id="theme">Dark mode</button>
    </header>

    <div class="hero">
      <h1 id="name">Your Name</h1>
      <p class="role" id="role"></p>
      <p class="intro" id="intro"></p>
      <div class="links" id="links"></div>
    </div>

    <section class="about" aria-labelledby="about-h">
      <h2 id="about-h">About</h2>
      <p id="about"></p>
    </section>

    <section aria-labelledby="feat-h">
      <h2 id="feat-h">Featured project</h2>
      <div class="feature">
        <div>
          <div class="shot"><img id="f-img" alt="" loading="lazy"></div>
          <div class="gallery" id="f-gallery"></div>
        </div>
        <div>
          <h3 id="f-title"></h3>
          <p class="summary" id="f-summary"></p>
          <div class="stats" id="f-stats"></div>
          <p class="label" id="f-role"></p>
          <ul class="did" id="f-did"></ul>
          <p class="label">Built with</p>
          <div class="chips" id="f-tech"></div>
          <div class="links" id="f-links"></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="skills-h">
      <h2 id="skills-h">Skills</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section aria-labelledby="proj-h" id="projects-section">
      <h2 id="proj-h">Other projects</h2>
      <div class="projects" id="projects"></div>
    </section>

    <footer><span id="foot"></span></footer>
  </div>

  <script>
    (function () {
      var data = JSON.parse(document.getElementById("profile").textContent);
      var $ = function (id) { return document.getElementById(id); };
      var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      var link = function (href, text, accent) { var a = el("a", "btn" + (accent ? " btn--accent" : ""), text); a.href = href; if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; } return a; };

      document.documentElement.style.setProperty("--accent", data.accent || "#5b3df5");
      document.title = data.name + " · Portfolio";
      $("name").textContent = data.name;
      $("mark").textContent = data.name.split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
      $("role").textContent = data.role + (data.location ? ", " + data.location : "");
      $("intro").textContent = data.intro;
      $("about").textContent = data.about;

      var L = data.links || {};
      if (L.github) $("links").append(link(L.github, "GitHub", true));
      if (L.linkedin) $("links").append(link(L.linkedin, "LinkedIn"));
      if (L.email) $("links").append(link("mailto:" + L.email, "Email me"));
      if (L.cv) $("links").append(link(L.cv, "Download CV"));

      var f = data.featured;
      $("f-img").src = f.image; $("f-img").alt = f.title + " screenshot";
      (f.gallery || []).forEach(function (src) { var d = el("div", "shot"); var i = el("img"); i.src = src; i.alt = f.title + " screenshot"; i.loading = "lazy"; d.append(i); $("f-gallery").append(d); });
      $("f-title").textContent = f.title;
      $("f-summary").textContent = f.summary;
      (f.highlights || []).forEach(function (h) { var d = el("div"); d.append(el("strong", null, h[0]), el("span", null, h[1])); $("f-stats").append(d); });
      $("f-role").textContent = f.role ? f.role + " What I did:" : "What I did:";
      (f.contributions || []).forEach(function (c) { $("f-did").append(el("li", null, c)); });
      (f.tech || []).forEach(function (t) { $("f-tech").append(el("span", "chip", t)); });
      if (f.demo) $("f-links").append(link(f.demo, "Live demo", true));
      if (f.code) $("f-links").append(link(f.code, "See the code", !f.demo));

      (data.skills || []).forEach(function (s) {
        var box = el("div", "skillset"); box.append(el("h3", null, s[0]));
        var chips = el("div", "chips"); s[1].forEach(function (t) { chips.append(el("span", "chip", t)); });
        box.append(chips); $("skills").append(box);
      });

      var projects = data.projects || [];
      if (!projects.length) $("projects-section").hidden = true;
      projects.forEach(function (p) {
        var c = el("article", "card"); c.append(el("h3", null, p.title), el("p", null, p.summary));
        var chips = el("div", "chips"); (p.tech || []).forEach(function (t) { chips.append(el("span", "chip", t)); }); c.append(chips);
        if (p.link) { var a = el("a", null, "View project"); a.href = p.link; a.target = "_blank"; a.rel = "noopener"; c.append(a); }
        $("projects").append(c);
      });
      $("foot").textContent = "© " + new Date().getFullYear() + " " + data.name + ". Built with plain HTML, CSS and JavaScript.";

      var root = document.documentElement, btn = $("theme");
      var dark = function () { var t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
      var paint = function () { btn.textContent = dark() ? "Light mode" : "Dark mode"; };
      try { var saved = localStorage.getItem("pf-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
      btn.addEventListener("click", function () { var next = dark() ? "light" : "dark"; root.setAttribute("data-theme", next); try { localStorage.setItem("pf-theme", next); } catch (e) {} paint(); });
      paint();
    })();
  </script>
</body>
</html>
